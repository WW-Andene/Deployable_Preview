<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  // Register the service worker on every load. Cache busting happens via
  // CACHE_VERSION inside sw.js; a fresh deploy + page reload picks up
  // the new shell automatically.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("/sw.js").catch(function(err) {
        console.warn("[sw] register failed:", err && err.message);
      });
    });
  }
</script>
</head>

<div id="app"></div>
<script src="js/app.js"></script>

</body>
