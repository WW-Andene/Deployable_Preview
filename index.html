<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DeployView</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0c10;color:#e4e0d8;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
input,select{background:#0b0c10;border:1.5px solid rgba(255,255,255,.06);color:#e4e0d8;font-family:monospace;font-size:14px;padding:12px;border-radius:6px;outline:none;width:100%}
input:focus{border-color:rgba(232,169,74,.5);box-shadow:0 0 0 3px rgba(232,169,74,.1)}
input::placeholder{color:#565250}
select{-webkit-appearance:none;appearance:none}
select option{background:#13141a;color:#e4e0d8}
button{display:inline-flex;align-items:center;gap:7px;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:6px;border:none;cursor:pointer}
.bp{background:#e8a94a;color:#0b0c10}
.bg{background:transparent;color:#9a9590;border:1.5px solid rgba(255,255,255,.06)}
.bd{background:rgba(224,84,104,.1);color:#e05468}
.bs{padding:7px 14px;font-size:13px}
.card{background:#13141a;border:1.5px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:14px}
.spin{width:18px;height:18px;border:2px solid #22242e;border-top-color:#e8a94a;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:100px;font-family:monospace;font-size:12px;cursor:pointer;border:1.5px solid rgba(255,255,255,.06);background:#13141a;color:#9a9590}
.chip.on{border-color:#e8a94a;background:rgba(232,169,74,.1);color:#e8a94a}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1.5px solid rgba(255,255,255,.06);background:rgba(11,12,16,.9);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.label{font-family:monospace;font-size:11px;color:#565250;text-transform:uppercase;letter-spacing:.08em}
.btag{display:inline-block;padding:4px 10px;border-radius:100px;font-family:monospace;font-size:11px}
.preview-frame{border:1.5px solid rgba(255,255,255,.06);border-radius:10px;overflow:hidden;background:#09090b;margin-bottom:16px}
.preview-frame .frame-label{padding:8px 12px;font-family:monospace;font-size:12px;font-weight:600;border-bottom:1.5px solid rgba(255,255,255,.06);background:#13141a;color:#9a9590}
.preview-frame .frame-body{position:relative;width:100%;overflow:hidden}
.preview-frame iframe{border:none;width:100%;height:100%;display:block;position:absolute;top:0;left:0}
.notif{position:fixed;top:60px;right:12px;z-index:200;background:#1a1c24;border:1.5px solid #48b088;border-radius:10px;padding:12px 16px;max-width:300px}
#error-display{position:fixed;bottom:10px;left:10px;right:10px;background:#2a0a0a;border:1px solid #e05468;color:#e05468;font-family:monospace;font-size:11px;padding:10px;border-radius:6px;z-index:999;display:none;word-break:break-all}
</style>
</head>
<body>
<div id="app"></div>
<div id="error-display"></div>
<script>
window.onerror=function(msg,src,line){
  var d=document.getElementById("error-display");
  d.style.display="block";
  d.textContent="Error: "+msg+" (line "+line+")";
};

(function(){
"use strict";

var POLL=15000;

/* Storage */
function lsGet(k){try{var v=localStorage.getItem("dv-"+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("dv-"+k,JSON.stringify(v))}catch(e){}}

/* GitHub */
function ghFetch(path,token){
  return fetch("https://api.github.com"+path,{
    headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github.v3+json"}
  }).then(function(r){
    if(!r.ok)return r.json().catch(function(){return{}}).then(function(e){throw new Error(e.message||"GitHub "+r.status)});
    return r.json();
  });
}

/* State */
var S={
  token:lsGet("token")||"",
  repos:lsGet("repos")||[],
  ratios:lsGet("ratios")||["9:16","16:9"],
  view:lsGet("token")?"dashboard":"setup",
  commits:{},prevShas:{},lastCheck:null,
  activeRepo:null,activeBranch:"",compareBranch:"",compareMode:false,
  refreshKey:0,pollTimer:null,
  repoUrl:"",repoInfo:null,fetchedBranches:[],selectedBranches:[],branchUrls:{},
  _tokenInput:""
};
function save(){lsSet("token",S.token);lsSet("repos",S.repos);lsSet("ratios",S.ratios)}

/* DOM builder */
function el(tag,props,kids){
  var e=document.createElement(tag);
  if(props){
    if(props.s)Object.assign(e.style,props.s);
    if(props.c)e.className=props.c;
    if(props.on)for(var ev in props.on)e.addEventListener(ev,props.on[ev]);
    if(props.attr)for(var a in props.attr)e.setAttribute(a,props.attr[a]);
  }
  if(kids!=null){
    if(!Array.isArray(kids))kids=[kids];
    for(var i=0;i<kids.length;i++){
      if(kids[i]==null)continue;
      if(typeof kids[i]==="string"||typeof kids[i]==="number")e.appendChild(document.createTextNode(""+kids[i]));
      else e.appendChild(kids[i]);
    }
  }
  return e;
}

function txt(t){return document.createTextNode(t)}

/* Helpers */
function timeAgo(ts){
  if(!ts)return"";var d=Date.now()-new Date(ts).getTime();
  if(d<60000)return"now";if(d<3.6e6)return Math.floor(d/60000)+"m";
  if(d<8.64e7)return Math.floor(d/3.6e6)+"h";return Math.floor(d/8.64e7)+"d";
}
function parseRepo(url){
  var c=url.trim().replace(/\.git$/,"").replace(/\/$/,"");
  var m=c.match(/(?:github\.com\/)?([^\/]+)\/([^\/]+)$/);
  return m?{owner:m[1],repo:m[2]}:null;
}
function getRepo(){
  for(var i=0;i<S.repos.length;i++)if(S.repos[i].id===S.activeRepo)return S.repos[i];
  return null;
}

/* Polling */
function startPoll(){
  if(S.pollTimer)clearInterval(S.pollTimer);
  doPoll();
  S.pollTimer=setInterval(doPoll,POLL);
}
function doPoll(){
  if(!S.token||!S.repos.length)return;
  for(var r=0;r<S.repos.length;r++){
    var repo=S.repos[r];
    for(var b=0;b<(repo.activeBranches||[]).length;b++){
      (function(repo,branch){
        var key=repo.owner+"/"+repo.repo+":"+branch;
        ghFetch("/repos/"+repo.owner+"/"+repo.repo+"/commits?sha="+branch+"&per_page=1",S.token)
        .then(function(data){
          var c=data[0];if(!c)return;
          var old=S.prevShas[key];
          S.commits[key]=c;S.prevShas[key]=c.sha;
          if(old&&old!==c.sha){
            S.refreshKey++;
            showNotif(branch,c.sha.slice(0,7),c.commit.message.split("\n")[0]);
            render();
          }
          S.lastCheck=Date.now();
        }).catch(function(){});
      })(repo,repo.activeBranches[b]);
    }
  }
}

/* Notification */
function showNotif(branch,sha,msg){
  var old=document.getElementById("notif");if(old)old.remove();
  var n=el("div",{c:"notif",attr:{id:"notif"}},[
    el("div",{s:{fontSize:"12px",fontWeight:"600",color:"#48b088"}},"Push detected — refreshing"),
    el("div",{s:{fontSize:"11px",color:"#9a9590",fontFamily:"monospace",marginTop:"4px"}},branch+" "+sha+" "+msg.slice(0,30))
  ]);
  document.body.appendChild(n);
  setTimeout(function(){n.remove()},5000);
}

/* Build preview panel */
function makePreview(ratioW,ratioH,label,url,key,color){
  var frame=el("div",{c:"preview-frame"});

  var lbl=el("div",{c:"frame-label",s:color?{color:color}:{}},label);
  frame.appendChild(lbl);

  // Calculate padding-bottom for aspect ratio (fallback for older browsers)
  var pct=(ratioH/ratioW*100).toFixed(2)+"%";
  var body=el("div",{c:"frame-body",s:{paddingBottom:pct}});

  if(url){
    var src=url+(url.indexOf("?")>-1?"&":"?")+"_r="+key;
    var iframe=document.createElement("iframe");
    iframe.src=src;
    iframe.title=label;
    iframe.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups allow-modals");
    iframe.setAttribute("allow","clipboard-write");
    iframe.style.cssText="border:none;width:100%;height:100%;position:absolute;top:0;left:0";

    var loader=el("div",{s:{position:"absolute",top:"0",left:"0",right:"0",bottom:"0",display:"flex",alignItems:"center",justifyContent:"center",background:"#09090b",zIndex:"2",transition:"opacity .3s"}},[
      el("span",{c:"spin"})
    ]);

    iframe.onload=function(){loader.style.opacity="0";setTimeout(function(){if(loader.parentNode)loader.remove()},300)};
    iframe.onerror=function(){loader.innerHTML="<span style='color:#e05468;font-family:monospace;font-size:12px'>Failed to load</span>"};

    body.appendChild(iframe);
    body.appendChild(loader);
  }else{
    body.appendChild(el("div",{s:{position:"absolute",top:"0",left:"0",right:"0",bottom:"0",display:"flex",alignItems:"center",justifyContent:"center",color:"#565250",fontFamily:"monospace",fontSize:"13px"}},"No URL set"));
  }

  frame.appendChild(body);
  return frame;
}

/* ════════════ RENDER ════════════ */
function render(){
  var app=document.getElementById("app");
  app.innerHTML="";

  /* Topbar */
  var left=el("div",{s:{display:"flex",alignItems:"center",gap:"10px"}});
  if(S.view!=="setup"&&S.view!=="dashboard"){
    left.appendChild(el("button",{c:"bg bs",on:{click:function(){S.view="dashboard";render()}}},"← Back"));
  }
  left.appendChild(el("span",{s:{fontWeight:"800",fontSize:"17px",letterSpacing:"-0.03em"}},[
    el("span",{s:{color:"#e8a94a"}},"Deploy"),txt("View")
  ]));

  var right=el("div",{s:{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}});

  if(S.view==="dashboard"){
    right.appendChild(el("button",{c:"bg bs",on:{click:function(){doPoll()}}},"↻"));
    right.appendChild(el("button",{c:"bp",on:{click:function(){
      S.repoUrl="";S.repoInfo=null;S.fetchedBranches=[];S.selectedBranches=[];S.branchUrls={};S.view="addRepo";render();
    }}},"+ Add Repo"));
  }
  if(S.view==="preview"){
    right.appendChild(el("button",{c:"bg bs",on:{click:function(){S.compareMode=!S.compareMode;S.compareBranch="";render()}}},S.compareMode?"Single":"Compare"));
    right.appendChild(el("button",{c:"bg bs",on:{click:function(){S.refreshKey++;render()}}},"↻ Refresh"));
  }
  if(S.view!=="setup"){
    right.appendChild(el("button",{c:"bg bs",on:{click:function(){S.token="";S.view="setup";save();render()}}},"Logout"));
  }

  app.appendChild(el("div",{c:"topbar"},[left,right]));

  /* ── SETUP ── */
  if(S.view==="setup"){
    var inp=document.createElement("input");
    inp.type="password";inp.placeholder="ghp_xxxx...";
    inp.addEventListener("input",function(e){S._tokenInput=e.target.value});

    var err=el("p",{s:{color:"#e05468",fontSize:"13px",fontFamily:"monospace",display:"none",marginTop:"8px"}},"Invalid token — check scope.");

    var btn=el("button",{c:"bp",on:{click:function(){
      var t=S._tokenInput;if(!t)return;
      btn.innerHTML="<span class='spin'></span>";
      ghFetch("/user",t).then(function(){
        S.token=t;save();S.view="dashboard";startPoll();render();
      }).catch(function(){
        err.style.display="block";btn.textContent="Connect";
      });
    }}},"Connect");

    app.appendChild(el("div",{s:{maxWidth:"460px",margin:"0 auto",padding:"60px 20px",textAlign:"center"}},[
      el("div",{s:{fontSize:"40px",marginBottom:"16px"}},"⚡"),
      el("h1",{s:{fontSize:"24px",fontWeight:"800",marginBottom:"10px"}},"Connect to GitHub"),
      el("p",{s:{color:"#9a9590",fontSize:"14px",marginBottom:"28px",lineHeight:"1.6"}},"Personal Access Token with repo scope."),
      el("div",{s:{display:"flex",gap:"8px",marginBottom:"4px"}},[inp,btn]),
      err,
      el("p",{s:{color:"#565250",fontSize:"11px",fontFamily:"monospace",marginTop:"20px"}},"Stored locally. Never shared.")
    ]));
    return;
  }

  if(S.token)startPoll();

  /* ── DASHBOARD ── */
  if(S.view==="dashboard"){
    var ct=el("div",{s:{maxWidth:"960px",margin:"0 auto",padding:"20px 16px"}});
    if(!S.repos.length){
      ct.appendChild(el("div",{s:{textAlign:"center",padding:"60px 0"}},[
        el("div",{s:{fontSize:"40px",marginBottom:"16px",opacity:".3"}},"◇"),
        el("h2",{s:{fontSize:"20px",fontWeight:"700",marginBottom:"10px"}},"No repositories yet"),
        el("p",{s:{color:"#565250",fontFamily:"monospace",fontSize:"13px",maxWidth:"440px",margin:"0 auto 24px",lineHeight:"1.6"}},"Add a GitHub repo, select branches, assign preview URLs."),
        el("button",{c:"bp",on:{click:function(){S.repoUrl="";S.repoInfo=null;S.fetchedBranches=[];S.selectedBranches=[];S.branchUrls={};S.view="addRepo";render()}}},"+ Add Repo")
      ]));
    }else{
      for(var i=0;i<S.repos.length;i++){
        (function(repo){
          var card=el("div",{c:"card"});
          card.appendChild(el("div",{s:{display:"flex",justifyContent:"space-between",marginBottom:"14px"}},[
            el("div",{},[
              el("h3",{s:{fontSize:"15px",fontWeight:"700",wordBreak:"break-all"}},repo.owner+"/"+repo.repo),
              repo.description?el("p",{s:{color:"#565250",fontSize:"12px",fontFamily:"monospace",marginTop:"4px"}},repo.description):null
            ]),
            el("button",{c:"bd bs",on:{click:function(){S.repos=S.repos.filter(function(r){return r.id!==repo.id});save();render()}}},"✕")
          ]));

          for(var j=0;j<(repo.activeBranches||[]).length;j++){
            (function(branch){
              var bUrl=(repo.branchUrls||{})[branch]||"";
              var cm=S.commits[repo.owner+"/"+repo.repo+":"+branch];
              var inp=document.createElement("input");
              inp.placeholder="http://localhost:8081";inp.value=bUrl;
              inp.style.cssText="padding:8px 10px;font-size:12px";
              inp.addEventListener("input",function(e){
                if(!repo.branchUrls)repo.branchUrls={};
                repo.branchUrls[branch]=e.target.value;save();
              });

              var isD=branch===repo.defaultBranch;
              var row=el("div",{s:{background:"#0b0c10",borderRadius:"10px",padding:"12px",border:"1.5px solid rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",marginBottom:"8px"}},[
                el("div",{s:{minWidth:"90px"}},[
                  el("span",{c:"btag",s:{background:isD?"rgba(232,169,74,.1)":"rgba(91,159,212,.1)",color:isD?"#e8a94a":"#5b9fd4"}},branch),
                  cm?el("div",{s:{marginTop:"4px",fontSize:"10px",color:"#565250",fontFamily:"monospace"}},cm.sha.slice(0,7)+" · "+timeAgo(cm.commit.author.date)):null
                ]),
                el("div",{s:{flex:"1",minWidth:"140px"}},[inp]),
                el("button",{c:"bp bs",s:{opacity:bUrl?"1":".4",pointerEvents:bUrl?"auto":"none"},on:{click:function(){
                  S.activeRepo=repo.id;S.activeBranch=branch;S.compareMode=false;S.compareBranch="";S.view="preview";render();
                }}},"▶ Preview")
              ]);
              card.appendChild(row);
            })(repo.activeBranches[j]);
          }
          ct.appendChild(card);
        })(S.repos[i]);
      }
    }
    app.appendChild(ct);return;
  }

  /* ── ADD REPO ── */
  if(S.view==="addRepo"){
    var w=el("div",{s:{maxWidth:"540px",margin:"0 auto",padding:"24px 16px"}});
    w.appendChild(el("h2",{s:{fontSize:"20px",fontWeight:"700",marginBottom:"20px"}},"Add Repository"));

    var ri=document.createElement("input");
    ri.placeholder="owner/repo or full GitHub URL";ri.value=S.repoUrl;
    ri.addEventListener("input",function(e){S.repoUrl=e.target.value});

    var es=el("span",{s:{color:"#e05468",fontSize:"12px",fontFamily:"monospace",display:"none"}});
    var fb=el("button",{c:"bp",on:{click:doFetch}},"Fetch");

    function doFetch(){
      var p=parseRepo(S.repoUrl);es.style.display="none";
      if(!p){es.textContent="Invalid. Use owner/repo.";es.style.display="block";return}
      if(S.repos.some(function(r){return r.owner===p.owner&&r.repo===p.repo})){es.textContent="Already added.";es.style.display="block";return}
      fb.innerHTML="<span class='spin'></span>";
      Promise.all([
        ghFetch("/repos/"+p.owner+"/"+p.repo,S.token),
        ghFetch("/repos/"+p.owner+"/"+p.repo+"/branches?per_page=100",S.token)
      ]).then(function(res){
        S.repoInfo=res[0];S.fetchedBranches=res[1].map(function(b){return b.name});
        S.selectedBranches=[res[0].default_branch];S.branchUrls={};
        for(var i=0;i<res[1].length;i++)S.branchUrls[res[1][i].name]="";
        fb.textContent="Fetch";render();
      }).catch(function(e){es.textContent=e.message;es.style.display="block";fb.textContent="Fetch"});
    }

    w.appendChild(el("div",{s:{marginBottom:"20px"}},[
      el("div",{c:"label",s:{marginBottom:"6px"}},"Repository"),
      el("div",{s:{display:"flex",gap:"8px"}},[ri,fb]),
      es
    ]));

    if(S.fetchedBranches.length&&S.repoInfo){
      w.appendChild(el("div",{c:"card",s:{marginBottom:"18px"}},[
        el("div",{s:{fontWeight:"700",fontSize:"14px"}},S.repoInfo.full_name),
        el("div",{s:{color:"#565250",fontSize:"12px",fontFamily:"monospace",marginTop:"4px"}},S.repoInfo.description||"No description")
      ]));

      var bd=el("div",{s:{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"6px"}});
      for(var i=0;i<S.fetchedBranches.length;i++){
        (function(b){
          var isOn=S.selectedBranches.indexOf(b)!==-1;
          bd.appendChild(el("div",{c:"chip"+(isOn?" on":""),on:{click:function(){
            var idx=S.selectedBranches.indexOf(b);
            if(idx!==-1)S.selectedBranches.splice(idx,1);else S.selectedBranches.push(b);
            render();
          }}},b));
        })(S.fetchedBranches[i]);
      }
      w.appendChild(el("div",{s:{marginBottom:"18px"}},[el("div",{c:"label",s:{marginBottom:"6px"}},"Branches to monitor"),bd]));

      if(S.selectedBranches.length){
        var ud=el("div",{s:{display:"flex",flexDirection:"column",gap:"8px"}});
        for(var i=0;i<S.selectedBranches.length;i++){
          (function(b){
            var inp=document.createElement("input");
            inp.placeholder="http://localhost:8081";inp.value=S.branchUrls[b]||"";
            inp.style.cssText="flex:1;padding:8px 10px;font-size:12px";
            inp.addEventListener("input",function(e){S.branchUrls[b]=e.target.value});
            ud.appendChild(el("div",{s:{display:"flex",alignItems:"center",gap:"8px"}},[
              el("span",{c:"btag",s:{background:"rgba(91,159,212,.1)",color:"#5b9fd4",minWidth:"60px",textAlign:"center"}},b),
              inp
            ]));
          })(S.selectedBranches[i]);
        }
        w.appendChild(el("div",{s:{marginBottom:"22px"}},[
          el("div",{c:"label",s:{marginBottom:"6px"}},"Preview URL per branch"),
          el("p",{s:{color:"#565250",fontSize:"11px",fontFamily:"monospace",marginBottom:"8px"}},"Optional — set later from dashboard."),
          ud
        ]));
      }

      w.appendChild(el("div",{s:{display:"flex",gap:"10px"}},[
        el("button",{c:"bg",on:{click:function(){S.view="dashboard";render()}}},"Cancel"),
        el("button",{c:"bp",s:{flex:"1",opacity:S.selectedBranches.length?"1":".4"},on:{click:function(){
          if(!S.selectedBranches.length)return;
          S.repos.push({
            id:S.repoInfo.owner.login+"/"+S.repoInfo.name,
            owner:S.repoInfo.owner.login,repo:S.repoInfo.name,
            description:S.repoInfo.description||"",
            defaultBranch:S.repoInfo.default_branch,
            activeBranches:S.selectedBranches.slice(),
            branchUrls:JSON.parse(JSON.stringify(S.branchUrls)),
            addedAt:Date.now()
          });
          save();S.view="dashboard";render();
        }}},"✓ Add Repository")
      ]));
    }
    app.appendChild(w);return;
  }

  /* ── PREVIEW ── */
  if(S.view==="preview"){
    var repo=getRepo();
    if(!repo){S.view="dashboard";render();return}
    var url=(repo.branchUrls||{})[S.activeBranch]||"";
    var cmpUrl=S.compareBranch?((repo.branchUrls||{})[S.compareBranch]||""):"";

    // Controls
    var ctrls=el("div",{s:{padding:"10px 16px",borderBottom:"1.5px solid rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",background:"#13141a"}});

    var sel=document.createElement("select");
    sel.style.cssText="width:140px;padding:8px 10px;font-size:13px";
    for(var i=0;i<(repo.activeBranches||[]).length;i++){
      var o=document.createElement("option");
      o.value=repo.activeBranches[i];o.textContent=repo.activeBranches[i];
      if(repo.activeBranches[i]===S.activeBranch)o.selected=true;
      sel.appendChild(o);
    }
    sel.addEventListener("change",function(e){S.activeBranch=e.target.value;render()});
    ctrls.appendChild(sel);

    if(S.compareMode){
      ctrls.appendChild(el("span",{s:{color:"#565250",fontFamily:"monospace",fontSize:"12px"}},"vs"));
      var s2=document.createElement("select");
      s2.style.cssText="width:140px;padding:8px 10px;font-size:13px";
      var o0=document.createElement("option");o0.value="";o0.textContent="Select…";s2.appendChild(o0);
      for(var i=0;i<(repo.activeBranches||[]).length;i++){
        if(repo.activeBranches[i]===S.activeBranch)continue;
        var o=document.createElement("option");
        o.value=repo.activeBranches[i];o.textContent=repo.activeBranches[i];
        if(repo.activeBranches[i]===S.compareBranch)o.selected=true;
        s2.appendChild(o);
      }
      s2.addEventListener("change",function(e){S.compareBranch=e.target.value;render()});
      ctrls.appendChild(s2);
    }

    // URL display
    var dot=el("span",{s:{width:"8px",height:"8px",borderRadius:"50%",background:url?"#48b088":"#e05468",display:"inline-block",flexShrink:"0"}});
    var urlTxt=el("span",{s:{fontFamily:"monospace",fontSize:"11px",color:url?"#9a9590":"#565250",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"300px",display:"inline-block"}},url||"No URL — set on dashboard");
    ctrls.appendChild(el("div",{s:{flex:"1",display:"flex",alignItems:"center",gap:"6px",minWidth:"0"}},[dot,urlTxt]));
    app.appendChild(ctrls);

    // Ratio toggles
    var ratioBar=el("div",{s:{padding:"8px 16px",borderBottom:"1.5px solid rgba(255,255,255,.06)",display:"flex",gap:"6px",flexWrap:"wrap"}});
    var ratioList=[{id:"9:16",w:9,h:16,label:"9:16 Portrait"},{id:"16:9",w:16,h:9,label:"16:9 Landscape"}];
    for(var i=0;i<ratioList.length;i++){
      (function(r){
        var isOn=S.ratios.indexOf(r.id)!==-1;
        ratioBar.appendChild(el("div",{c:"chip"+(isOn?" on":""),on:{click:function(){
          var idx=S.ratios.indexOf(r.id);
          if(idx!==-1&&S.ratios.length>1)S.ratios.splice(idx,1);
          else if(idx===-1)S.ratios.push(r.id);
          save();render();
        }}},r.label));
      })(ratioList[i]);
    }
    app.appendChild(ratioBar);

    // Commit info
    var cm=S.commits[repo.owner+"/"+repo.repo+":"+S.activeBranch];
    if(cm){
      app.appendChild(el("div",{s:{padding:"8px 16px",borderBottom:"1.5px solid rgba(255,255,255,.06)",fontSize:"11px",fontFamily:"monospace",color:"#565250",display:"flex",gap:"8px",flexWrap:"wrap"}},[
        el("span",{s:{color:"#9a9590"}},cm.sha.slice(0,7)),
        el("span",{},cm.commit.message.split("\n")[0].slice(0,50)),
        el("span",{s:{marginLeft:"auto"}},timeAgo(cm.commit.author.date))
      ]));
    }

    // Panels
    var activeRatios=ratioList.filter(function(r){return S.ratios.indexOf(r.id)!==-1});
    var container=el("div",{s:{padding:"16px",display:"flex",flexDirection:"column",gap:"16px"}});

    if(S.compareMode){
      for(var i=0;i<activeRatios.length;i++){
        var r=activeRatios[i];
        var row=el("div",{s:{display:"flex",gap:"16px",flexWrap:"wrap"}});
        var leftW=el("div",{s:{flex:"1",minWidth:"280px"}});
        leftW.appendChild(makePreview(r.w,r.h,S.activeBranch+" — "+r.label,url,S.refreshKey,"#e8a94a"));
        row.appendChild(leftW);
        var rightW=el("div",{s:{flex:"1",minWidth:"280px"}});
        if(S.compareBranch&&cmpUrl){
          rightW.appendChild(makePreview(r.w,r.h,S.compareBranch+" — "+r.label,cmpUrl,S.refreshKey,"#5b9fd4"));
        }else{
          rightW.appendChild(makePreview(r.w,r.h,S.compareBranch||"Select branch","",S.refreshKey,"#5b9fd4"));
        }
        row.appendChild(rightW);
        container.appendChild(row);
      }
    }else{
      for(var i=0;i<activeRatios.length;i++){
        var r=activeRatios[i];
        var maxW=r.w>r.h?"100%":"400px";
        var wrap=el("div",{s:{maxWidth:maxW}});
        wrap.appendChild(makePreview(r.w,r.h,r.label,url,S.refreshKey,null));
        container.appendChild(wrap);
      }
    }
    app.appendChild(container);

    if(!url){
      app.appendChild(el("div",{s:{margin:"0 16px 16px",padding:"14px",background:"rgba(232,169,74,.1)",border:"1.5px solid rgba(232,169,74,.2)",borderRadius:"10px",fontFamily:"monospace",fontSize:"12px",color:"#9a9590",lineHeight:"1.7"}},[
        el("strong",{s:{color:"#e8a94a"}},"No URL for \""+S.activeBranch+"\""),
        txt(" — set one on the dashboard.")
      ]));
    }
  }
}

/* Init */
render();
if(S.token)startPoll();

})();
</script>
</body>
</html>
